<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Little Dominoes</title>
<meta name="theme-color" content="#3d8f6f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Little Dominoes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
<style>
:root{--bg:#f7f4ea;--ink:#24303a;--accent:#3d8f6f;--accent2:#f2b84b;--muted:#6e7b83;--shadow:0 8px 22px rgba(30,40,45,.12)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;color:var(--ink)}body{min-height:100dvh;display:flex;justify-content:center}button,input{font:inherit}.screen{width:min(100%,560px);min-height:100dvh;padding:max(28px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}.brand{text-align:center;margin-bottom:24px}.brand-icon{width:82px;height:82px;margin:0 auto 13px;background:#fff;border:3px solid #29343b;border-radius:20px;box-shadow:0 7px 0 rgba(0,0,0,.12);display:grid;grid-template-columns:1fr 1fr;position:relative;transform:rotate(-8deg)}.brand-icon:after{content:"";position:absolute;top:10px;bottom:10px;left:50%;width:3px;background:#29343b}.pipset{position:relative}.pip{width:9px;height:9px;background:#26323a;border-radius:50%;position:absolute}.brand h1{font-size:36px;line-height:1;margin:0;letter-spacing:-.04em}.brand p{margin:8px 0 0;color:var(--muted);font-weight:700}.choices{display:grid;gap:12px}.choice{width:100%;border:0;background:#fff;border-radius:22px;padding:17px 18px;display:grid;grid-template-columns:48px 1fr 24px;align-items:center;gap:12px;text-align:left;box-shadow:var(--shadow);color:var(--ink)}.choice-icon{width:48px;height:48px;border-radius:15px;background:#e7f3ed;display:grid;place-items:center;font-size:25px}.choice:nth-child(2) .choice-icon{background:#fff1d2}.choice:nth-child(3) .choice-icon{background:#e6edf8}.choice b{display:block;font-size:18px}.choice span{display:block;color:var(--muted);font-size:13px;margin-top:3px}.arrow{font-size:22px;color:#a1aaa7}.panel{display:none;background:#fff;border-radius:26px;padding:22px;box-shadow:var(--shadow)}.panel.show{display:block}.panel h2{margin:0 0 6px;font-size:27px}.panel>p{color:var(--muted);margin:0 0 16px;line-height:1.4}.online-actions{display:grid;gap:10px}.bigbtn,.secondary{width:100%;border:0;border-radius:17px;padding:14px 16px;font-weight:900;font-size:17px}.bigbtn{background:var(--accent2);color:#2d2b24;box-shadow:0 5px 0 #c58e29}.secondary{background:#eef3f0;color:var(--ink)}.room-input{width:100%;border:2px solid #dcded9;border-radius:17px;padding:15px;text-transform:uppercase;text-align:center;letter-spacing:.15em;font-size:22px;font-weight:900;color:var(--ink);background:#fff}.back{margin-top:12px;background:none;border:0;color:var(--muted);font-weight:900;width:100%;padding:10px}.deep-link{background:#e7f3ed;border-radius:16px;padding:13px;text-align:center;font-weight:800;margin-bottom:14px}.hidden{display:none!important}.settings{background:#f6f7f2;border-radius:18px;padding:5px 14px;margin-bottom:12px}.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #e4e5df}.setting:last-child{border-bottom:0}.setting b{display:block;font-size:15px}.setting small{display:block;color:var(--muted);margin-top:2px}.switch{width:54px;height:32px;border:0;border-radius:999px;background:#c9cec9;padding:3px;flex:0 0 auto}.switch:after{content:"";display:block;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.15s}.switch.on{background:var(--accent)}.switch.on:after{transform:translateX(22px)}.section-label{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:5px 2px 7px}
</style>
</head>
<body>
<main class="screen">
<section class="brand" id="brand"><div class="brand-icon"><div class="pipset"><i class="pip" style="left:26%;top:26%"></i><i class="pip" style="right:26%;bottom:26%"></i></div><div class="pipset"><i class="pip" style="left:24%;top:24%"></i><i class="pip" style="right:24%;top:24%"></i><i class="pip" style="left:24%;bottom:24%"></i><i class="pip" style="right:24%;bottom:24%"></i></div></div><h1>Little Dominoes</h1><p>How would you like to play?</p></section>
<section class="choices" id="choices">
<button class="choice" id="computerBtn"><div class="choice-icon">🤖</div><div><b>Play the computer</b><span>One player, with adjustable difficulty</span></div><div class="arrow">›</div></button>
<button class="choice" id="localBtn"><div class="choice-icon">👥</div><div><b>Two players</b><span>Pass this device between players</span></div><div class="arrow">›</div></button>
<button class="choice" id="onlineBtn"><div class="choice-icon">🌐</div><div><b>Online game</b><span>Create a live room or join with a code</span></div><div class="arrow">›</div></button>
</section>
<section class="panel" id="onlinePanel"><h2>Online game</h2><p id="onlineIntro">Create a room and invite someone, or enter a room code you have been sent.</p><div id="deepLinkNotice" class="deep-link hidden"></div>
<div id="hostSettings"><div class="section-label">New game settings</div><div class="settings"><div class="setting"><div><b>Highlight playable dominoes</b><small>Helpful for younger players</small></div><button class="switch" id="onlineHighlight" aria-label="Toggle highlighting"></button></div><div class="setting"><div><b>Branching doubles</b><small>Doubles create extra playable arms</small></div><button class="switch" id="onlineBranch" aria-label="Toggle branching doubles"></button></div></div></div>
<div class="online-actions"><button class="bigbtn" id="createRoomBtn">Create game</button><div class="section-label">Or join a game</div><input class="room-input" id="roomInput" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ROOM CODE" aria-label="Room code"/><button class="secondary" id="joinRoomBtn">Join room</button></div><button class="back" id="backBtn">← Back to game types</button></section>
</main>
<script>
const SETTINGS_KEY='littleDominoesSettings', $=id=>document.getElementById(id);
function loadSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}catch{return{}}}
function setMode(mode){const current=loadSettings();localStorage.setItem(SETTINGS_KEY,JSON.stringify({...current,mode}));location.href='./index.html?play=1'}
function cleanRoom(v){return(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)}
function randomRoom(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let out='';for(let i=0;i<6;i++)out+=chars[Math.floor(Math.random()*chars.length)];return out}
function onlinePrefs(){return{highlight:$('onlineHighlight').classList.contains('on'),branching:$('onlineBranch').classList.contains('on')}}
function enterRoom(code,role,prefs=null){let url=`./online.html?room=${encodeURIComponent(cleanRoom(code))}&role=${role}`;if(role==='host'&&prefs){url+=`&highlight=${prefs.highlight?1:0}&branching=${prefs.branching?1:0}`}location.href=url}
function syncPrefs(){const p=loadSettings();$('onlineHighlight').classList.toggle('on',p.highlight!==false);$('onlineBranch').classList.toggle('on',!!p.branching)}
function showOnline(code=''){syncPrefs();$('choices').classList.add('hidden');$('onlinePanel').classList.add('show');$('brand').querySelector('p').textContent=code?'You have been invited to a game':'Create a room or join one';if(code){$('roomInput').value=code;$('deepLinkNotice').textContent=`Invite received · room ${code}`;$('deepLinkNotice').classList.remove('hidden');$('hostSettings').classList.add('hidden');$('createRoomBtn').classList.add('hidden');$('onlineIntro').textContent='Join the game below. The host has chosen the game settings.'}else{$('hostSettings').classList.remove('hidden');$('createRoomBtn').classList.remove('hidden')}}
function showChoices(){history.replaceState({},'',location.pathname);$('choices').classList.remove('hidden');$('onlinePanel').classList.remove('show');$('deepLinkNotice').classList.add('hidden');$('brand').querySelector('p').textContent='How would you like to play?'}
$('computerBtn').onclick=()=>setMode('single');$('localBtn').onclick=()=>setMode('two');$('onlineBtn').onclick=()=>showOnline();$('backBtn').onclick=showChoices;
$('onlineHighlight').onclick=()=>$('onlineHighlight').classList.toggle('on');$('onlineBranch').onclick=()=>$('onlineBranch').classList.toggle('on');
$('createRoomBtn').onclick=()=>enterRoom(randomRoom(),'host',onlinePrefs());$('roomInput').oninput=e=>e.target.value=cleanRoom(e.target.value);$('joinRoomBtn').onclick=()=>{const code=cleanRoom($('roomInput').value);if(code.length<4){$('roomInput').focus();return}enterRoom(code,'guest')};
const deep=cleanRoom(new URLSearchParams(location.search).get('join'));if(deep)showOnline(deep);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script>
</body></html>
