<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />

<meta name="theme-color" content="#3d8f6f" />

<style>
:root{--bg:#f7f4ea;--ink:#24303a;--card:#fffdf7;--accent:#3d8f6f;--accent2:#f2b84b;--muted:#6e7b83;--shadow:0 8px 22px rgba(30,40,45,.12)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;color:var(--ink)}body{min-height:100dvh;display:flex;justify-content:center}button{font:inherit}.app{width:min(100%,760px);min-height:100dvh;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-size:clamp(21px,5vw,32px);font-weight:900;letter-spacing:-.03em}.top-actions{display:flex;gap:7px}.smallbtn{border:0;border-radius:999px;background:#fff;padding:9px 12px;box-shadow:var(--shadow);font-weight:800;color:var(--ink)}.network{margin:8px 0 6px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:12px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:#c4a044}.dot.online{background:#39a36e}.dot.offline{background:#ca5d5d}.status{margin:4px 0 8px;background:var(--card);border-radius:18px;padding:11px 14px;box-shadow:var(--shadow);text-align:center}.status strong{display:block;font-size:19px}.status span{color:var(--muted);font-size:13px}.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:0 4px 8px}.scorebox{background:#fff;border-radius:14px;padding:7px 9px;box-shadow:var(--shadow);text-align:center}.scorebox b{display:block;font-size:21px}.scorebox span,.roundno{font-size:11px;color:var(--muted);font-weight:800}.opponent-row,.hand-row{display:flex;align-items:center;justify-content:center;gap:7px;min-height:68px;flex-wrap:wrap}.opponent-label,.hand-label{text-align:center;color:var(--muted);font-size:13px;font-weight:800}.board-wrap{position:relative;flex:1;min-height:225px;margin:6px 0;background:linear-gradient(180deg,#cde8d9,#b8dbc8);border-radius:28px;overflow:hidden;padding:14px 10px}.board{display:flex;align-items:center;justify-content:flex-start;gap:6px;overflow-x:auto;padding:10px 16px;min-height:80px}.board:empty::after{content:"Waiting for the first domino";margin:auto;color:#4d6c5d;font-weight:900;font-size:17px}.branches{display:flex;flex-direction:column;gap:7px;padding:6px 12px}.branch{display:flex;align-items:center;gap:6px;overflow-x:auto}.branch-label{font-weight:900;color:#4d6c5d;font-size:12px}.targets{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:6px 8px}.targetbtn{border:0;background:transparent;padding:3px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#4d6c5d;font-weight:800;font-size:9px;min-width:44px}.targetbtn:disabled{opacity:.25}.target-mini{width:42px;height:24px;background:#fff;border:2px solid #29343b;border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.10);display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden}.target-mini::after{content:"";position:absolute;top:4px;bottom:4px;left:50%;width:2px;background:#29343b}.targetbtn.active .target-mini{outline:4px solid var(--accent2);transform:translateY(-2px)}.target-caption{text-transform:uppercase}.domino{flex:0 0 auto;width:48px;height:88px;background:#fff;border:2px solid #29343b;border-radius:9px;box-shadow:0 4px 0 rgba(0,0,0,.12);display:grid;grid-template-rows:1fr 1fr;position:relative;overflow:hidden;transition:.15s transform,.15s opacity}.domino.horizontal{width:88px;height:48px;grid-template-columns:1fr 1fr;grid-template-rows:1fr}.domino.horizontal::after{content:"";position:absolute;top:6px;bottom:6px;left:50%;width:2px;background:#29343b}.domino:not(.horizontal)::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;background:#29343b}.domino.playable{outline:4px solid var(--accent2);transform:translateY(-3px)}.domino.selected{outline:5px solid var(--accent);transform:translateY(-5px)}.domino.disabled{opacity:.45}.half{display:grid;place-items:center;position:relative}.pip{width:7px;height:7px;border-radius:50%;background:#26323a;position:absolute}.target-mini .pip{width:4px;height:4px}.back{width:36px;height:58px;border-radius:8px;background:repeating-linear-gradient(45deg,#467cbd 0 7px,#fff 7px 11px);border:2px solid #29343b;box-shadow:0 3px 0 rgba(0,0,0,.12)}.hintbar{display:flex;gap:8px;justify-content:center;margin:4px 0 8px}.action{border:0;border-radius:16px;padding:11px 17px;background:var(--accent);color:#fff;font-weight:900;box-shadow:0 5px 0 #2a6d55}.action.secondary{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d9d7d0}.action:disabled{opacity:.4;box-shadow:none}.hand-scroll{overflow-x:auto;padding:2px 4px 8px}.hand-row{justify-content:flex-start;flex-wrap:nowrap;min-width:max-content;padding:2px 8px}.modal{position:fixed;inset:0;background:rgba(20,28,32,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modal-card{background:#fff;border-radius:28px;max-width:420px;width:100%;padding:24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}.modal-card h2{font-size:29px;margin:0 0 8px}.modal-card p{color:var(--muted)}.bigbtn{width:100%;border:0;border-radius:18px;padding:15px;background:var(--accent2);font-weight:900;font-size:18px}.waiting{position:fixed;inset:0;background:var(--bg);z-index:12;display:flex;align-items:center;justify-content:center;padding:26px;text-align:center}.waiting.hidden{display:none}.wait-card{max-width:420px}.wait-card h1{font-size:32px;margin:0 0 8px}.room{font-size:28px;letter-spacing:.14em;font-weight:900;background:#fff;padding:12px 18px;border-radius:16px;display:inline-block;margin:12px 0;box-shadow:var(--shadow)}.wait-card p{color:var(--muted)}
</style>
</head>
<body>
<div class="waiting" id="waiting"><div class="wait-card"><h1>Online Dominoes</h1><p id="waitText">Connecting to the room…</p><div class="room" id="waitRoom"></div><button class="action" id="waitShare" style="display:none">Invite player</button><p><button class="smallbtn" onclick="location.href='./launcher.html'">New game</button></p></div></div>
<div class="app">
<div class="topbar"><div class="title">Little Dominoes</div><div class="top-actions"><button class="smallbtn" id="shareBtn">Invite</button><button class="smallbtn" id="newGameBtn">New game</button></div></div>
<div class="network"><i class="dot" id="netDot"></i><span id="netText">Connecting…</span></div>
<div class="status" id="status"><strong>Connecting…</strong><span>Room <span id="roomInline"></span></span></div>
<div class="scorebar"><div class="scorebox"><span>Player 1</span><b id="score0">0</b></div><div class="roundno" id="roundNo">Round 1 · first to 50</div><div class="scorebox"><span>Player 2</span><b id="score1">0</b></div></div>
<div class="opponent-label" id="opponentLabel">Opponent</div><div class="opponent-row" id="opponentHand"></div>
<div class="board-wrap"><div class="board" id="board"></div><div class="branches" id="branches"></div><div class="targets" id="targets"></div></div>
<div class="hintbar"><button class="action secondary" id="hintBtn">✨ Strategy hint</button><button class="action" id="drawBtn">Draw one</button></div>
<div class="hand-label" id="handLabel">Your dominoes</div><div class="hand-scroll"><div class="hand-row" id="playerHand"></div></div>
</div>
<div class="modal" id="modal"><div class="modal-card"><div style="font-size:44px">🏆</div><h2 id="modalTitle"></h2><p id="modalText"></p><button class="bigbtn" id="nextBtn">Next round</button></div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://smwcemcmexgqcbanwody.supabase.co';
const SUPABASE_KEY='sb_publishable_PmBMSUOkdINMX4lH1iujXQ_F_dlSrQd';
const MAX=6,TARGET_SCORE=50;
const params=new URLSearchParams(location.search),room=(params.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6),role=params.get('role')==='host'?'host':'guest',me=role==='host'?0:1;
if(!room)location.replace('./launcher.html');
const $=id=>document.getElementById(id);$('waitRoom').textContent=room;$('roomInline').textContent=room;
const playerId=localStorage.getItem('littleDominoesPlayerId')||crypto.randomUUID();localStorage.setItem('littleDominoesPlayerId',playerId);
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
let channel,state=null,selectedIndex=null,connected=false,peerPresent=false;
const storageKey=`littleDominoesOnline:${room}:host`;
function hostSettings(){return{highlight:params.get('highlight')!=='0',branching:params.get('branching')==='1'}}
function makeSet(){const s=[];for(let a=0;a<=MAX;a++)for(let b=a;b<=MAX;b++)s.push([a,b]);for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]]}return s}
function freshState(round=1,scores=[0,0],settings=hostSettings()){const stock=makeSet();return{version:2,settings,scores,round,stock,hands:[stock.splice(0,7),stock.splice(0,7)],chain:[],branches:[],turn:(round-1)%2,failedEnds:[{},{}],nextBranchId:1,gameOver:false,matchOver:false,result:null}}
function saveState(){if(role==='host'&&state)localStorage.setItem(storageKey,JSON.stringify(state))}
function loadState(){try{return JSON.parse(localStorage.getItem(storageKey)||'null')}catch{return null}}
function publish(){saveState();channel?.send({type:'broadcast',event:'state',payload:{state}});render()}
function pipPositions(n){return{0:[],1:[[50,50]],2:[[30,30],[70,70]],3:[[30,30],[50,50],[70,70]],4:[[30,30],[70,30],[30,70],[70,70]],5:[[30,30],[70,30],[50,50],[30,70],[70,70]],6:[[30,24],[70,24],[30,50],[70,50],[30,76],[70,76]]}[n]}
function halfHTML(n){return`<div class="half">${pipPositions(n).map(([x,y])=>`<span class="pip" style="left:${x}%;top:${y}%;transform:translate(-50%,-50%)"></span>`).join('')}</div>`}
function dominoHTML(d,cls='',idx=''){return`<div class="domino ${cls}" data-i="${idx}">${halfHTML(d[0])}${halfHTML(d[1])}</div>`}
function targetMini(n){return`<span class="target-mini">${halfHTML(n)}${halfHTML(n)}</span>`}
function mainEnds(){return state.chain.length?[state.chain[0][0],state.chain[state.chain.length-1][1]]:[null,null]}
function openTargets(){if(!state.chain.length)return[];const[L,R]=mainEnds(),t=[{id:'left',value:L,caption:'left'},{id:'right',value:R,caption:'right'}];if(state.settings.branching)for(const b of state.branches)t.push({id:`branch:${b.id}`,value:b.open,caption:`arm ${b.id}`});return t}
function targetValue(target){if(target==='left')return mainEnds()[0];if(target==='right')return mainEnds()[1];if(target.startsWith('branch:')){const b=state.branches.find(x=>x.id===Number(target.split(':')[1]));return b?.open}return null}
function oriented(d,target){if(target==='start')return d.slice();const v=targetValue(target);if(d[0]===v)return[d[0],d[1]];if(d[1]===v)return[d[1],d[0]];return null}
function movesFor(hand){if(!state.chain.length)return hand.map((_,i)=>({i,target:'start'}));const m=[];for(let i=0;i<hand.length;i++)for(const t of openTargets())if(hand[i][0]===t.value||hand[i][1]===t.value)m.push({i,target:t.id});return m}
function spawnBranch(d){if(state.settings.branching&&d[0]===d[1])state.branches.push({id:state.nextBranchId++,root:d[0],open:d[0],tiles:[]})}
function play(i,target){const raw=state.hands[me][i],d=oriented(raw,target);if(!d)return false;state.hands[me].splice(i,1);if(target==='start'){state.chain.push(d);spawnBranch(d)}else if(target==='left'){state.chain.unshift([d[1],d[0]]);spawnBranch(raw)}else if(target==='right'){state.chain.push(d);spawnBranch(raw)}else{const b=state.branches.find(x=>x.id===Number(target.split(':')[1]));if(!b)return false;b.tiles.push(d);b.open=d[1];spawnBranch(raw)}selectedIndex=null;return true}
function handValue(h){return h.flat().reduce((a,b)=>a+b,0)}
function noteFailure(who){for(const t of openTargets())state.failedEnds[who][t.value]=(state.failedEnds[who][t.value]||0)+1}
function checkRoundEnd(){if(state.hands[0].length===0)return endRound(0,'went out');if(state.hands[1].length===0)return endRound(1,'went out');if(state.stock.length===0&&!movesFor(state.hands[0]).length&&!movesFor(state.hands[1]).length){const a=handValue(state.hands[0]),b=handValue(state.hands[1]);return endRound(a===b?null:(a<b?0:1),'blocked')}return false}
function endRound(winner,reason){state.gameOver=true;let points=0;if(winner!==null){points=reason==='went out'?handValue(state.hands[1-winner]):Math.abs(handValue(state.hands[0])-handValue(state.hands[1]));state.scores[winner]+=points}state.matchOver=winner!==null&&state.scores[winner]>=TARGET_SCORE;state.result={winner,reason,points};publish();return true}
function showRoundResult(){if(!state?.gameOver||!state.result)return;const{winner,reason,points}=state.result;let title,text;if(winner===null){title='Round drawn';text='Both players are blocked with the same number of dots.'}else if(state.matchOver){title=`Player ${winner+1} wins the match!`;text=`Final score ${state.scores[0]}–${state.scores[1]}.`}else{title=`Player ${winner+1} wins the round!`;text=`+${points} points · score ${state.scores[0]}–${state.scores[1]}.`}$('modalTitle').textContent=title;$('modalText').textContent=text;$('nextBtn').textContent=role==='host'?(state.matchOver?'New match':'Next round'):'Waiting for host…';$('nextBtn').disabled=role!=='host';$('modal').classList.add('show')}
function render(){if(!state)return;const myHand=state.hands[me],opp=state.hands[1-me],pm=movesFor(myHand),playable=new Set(pm.map(x=>x.i)),myTurn=state.turn===me&&!state.gameOver&&peerPresent;$('score0').textContent=state.scores[0];$('score1').textContent=state.scores[1];$('roundNo').textContent=`Round ${state.round} · first to ${TARGET_SCORE}`;$('opponentLabel').textContent=`Player ${2-me} · ${opp.length} dominoes`;$('handLabel').textContent=`Your dominoes · ${myHand.length}`;$('opponentHand').innerHTML=opp.map(()=>'<div class="back"></div>').join('');$('board').innerHTML=state.chain.map(d=>dominoHTML(d,'horizontal')).join('');$('branches').innerHTML=state.settings.branching?state.branches.map(b=>`<div class="branch"><span class="branch-label">arm ${b.id}</span>${b.tiles.map(d=>dominoHTML(d,'horizontal')).join('')||targetMini(b.open)}</div>`).join(''):'';const legalTargets=selectedIndex===null?new Set():new Set(pm.filter(x=>x.i===selectedIndex).map(x=>x.target));$('targets').innerHTML=state.chain.length?openTargets().map(t=>`<button class="targetbtn ${legalTargets.has(t.id)?'active':''}" data-target="${t.id}" ${!myTurn||selectedIndex===null||!legalTargets.has(t.id)?'disabled':''}>${targetMini(t.value)}<span class="target-caption">${t.caption}</span></button>`).join(''):'';[...$('targets').querySelectorAll('.targetbtn')].forEach(b=>b.onclick=()=>{if(play(selectedIndex,b.dataset.target)){state.turn=1-me;if(!checkRoundEnd())publish()}});$('playerHand').innerHTML=myHand.map((d,i)=>{let c='';if(myTurn&&state.settings.highlight&&playable.has(i))c+=' playable';if(selectedIndex===i)c+=' selected';if(!myTurn||(!playable.has(i)&&state.chain.length))c+=' disabled';return dominoHTML(d,c,i)}).join('');[...$('playerHand').querySelectorAll('.domino')].forEach(el=>el.onclick=()=>chooseDomino(Number(el.dataset.i)));$('drawBtn').disabled=!myTurn||pm.length>0;$('drawBtn').textContent=state.stock.length?'Draw one':'Pass turn';$('hintBtn').disabled=!myTurn;let big,small;if(!peerPresent){big='Waiting for opponent';small='The game will resume when they reconnect.'}else if(state.gameOver){big='Round complete';small=`Score ${state.scores[0]}–${state.scores[1]}`}else if(myTurn){big='Your turn';small=pm.length?(selectedIndex!==null?'Choose a highlighted open domino.':'Choose a playable domino.'):(state.stock.length?'No match — draw one.':'No match — pass.')}else{big=`Player ${2-me}’s turn`;small='Waiting for their move…'}$('status').innerHTML=`<strong>${big}</strong><span>${small}</span>`;if(state.gameOver)showRoundResult();else $('modal').classList.remove('show')}
function chooseDomino(i){if(!state||state.turn!==me||state.gameOver||!peerPresent)return;const legal=movesFor(state.hands[me]).filter(x=>x.i===i);if(state.chain.length&&!legal.length)return;selectedIndex=selectedIndex===i?null:i;render();if(!state.chain.length&&selectedIndex!==null){play(selectedIndex,'start');state.turn=1-me;if(!checkRoundEnd())publish()}else if(selectedIndex!==null&&legal.length===1){play(selectedIndex,legal[0].target);state.turn=1-me;if(!checkRoundEnd())publish()}}
$('drawBtn').onclick=()=>{if(!state||state.turn!==me||state.gameOver)return;const hand=state.hands[me];if(movesFor(hand).length)return;noteFailure(me);if(state.stock.length){hand.push(state.stock.pop());if(!movesFor(hand).length)state.turn=1-me}else state.turn=1-me;if(!checkRoundEnd())publish()};
$('hintBtn').onclick=()=>{if(!state||state.turn!==me)return;const m=movesFor(state.hands[me]);if(!m.length)return;const best=[...m].sort((a,b)=>(state.hands[me][b.i][0]+state.hands[me][b.i][1])-(state.hands[me][a.i][0]+state.hands[me][a.i][1]))[0];selectedIndex=best.i;render();$('status').innerHTML='<strong>Strategy hint</strong><span>Try the highlighted domino. High-value tiles are often worth shedding early.</span>'};
$('nextBtn').onclick=()=>{if(role!=='host'||!state)return;$('modal').classList.remove('show');state=state.matchOver?freshState(1,[0,0],state.settings):freshState(state.round+1,state.scores,state.settings);publish()};
function inviteUrl(){const u=new URL('./launcher.html',location.href);u.searchParams.set('join',room);return u.href}async function share(){const data={title:'Little Dominoes',text:`Join my Little Dominoes game — room ${room}`,url:inviteUrl()};if(navigator.share){try{await navigator.share(data);return}catch(e){if(e.name==='AbortError')return}}await navigator.clipboard?.writeText(inviteUrl())}$('shareBtn').onclick=share;$('waitShare').onclick=share;
$('newGameBtn').onclick=()=>location.href='./launcher.html';
function updatePresence(){if(!channel)return;const roles=Object.values(channel.presenceState()).flat().map(x=>x.role);peerPresent=role==='host'?roles.includes('guest'):roles.includes('host');$('netDot').className=`dot ${connected?(peerPresent?'online':''):'offline'}`;$('netText').textContent=!connected?'Disconnected':peerPresent?'Opponent connected':'Waiting for opponent';if(role==='host'&&!state){const saved=loadState();state=saved?.version===2?saved:freshState();saveState()}if(peerPresent&&role==='host'&&state)channel.send({type:'broadcast',event:'state',payload:{state}});if(peerPresent&&state)$('waiting').classList.add('hidden');else{$('waiting').classList.remove('hidden');$('waitText').textContent=connected?(role==='host'?'Waiting for Player 2 to join…':'Waiting for the host…'):'Connecting to Supabase…';$('waitShare').style.display=role==='host'?'inline-block':'none'}render()}
channel=supabase.channel(`dominoes:${room}`,{config:{presence:{key:playerId},broadcast:{ack:true}}}).on('presence',{event:'sync'},updatePresence).on('broadcast',{event:'state'},({payload})=>{if(!payload?.state)return;state=payload.state;selectedIndex=null;$('waiting').classList.add('hidden');render()}).on('broadcast',{event:'request-state'},()=>{if(role==='host'&&state)channel.send({type:'broadcast',event:'state',payload:{state}})}).subscribe(async status=>{if(status==='SUBSCRIBED'){connected=true;await channel.track({role,playerId,joinedAt:Date.now()});if(role==='guest')channel.send({type:'broadcast',event:'request-state',payload:{playerId}});updatePresence()}else if(status==='CLOSED'||status==='CHANNEL_ERROR'||status==='TIMED_OUT'){connected=false;updatePresence()}});
window.addEventListener('beforeunload',()=>channel?.untrack());
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script>
</body></html>
