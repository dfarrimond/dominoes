<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Little Dominoes</title>
<style>
  :root{
    --bg:#f7f4ea;
    --ink:#24303a;
    --card:#fffdf7;
    --accent:#3d8f6f;
    --accent2:#f2b84b;
    --muted:#6e7b83;
    --shadow:0 8px 22px rgba(30,40,45,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);font-family:ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;color:var(--ink)}
  body{min-height:100dvh;display:flex;justify-content:center}
  button{font:inherit}
  .app{width:min(100%,760px);min-height:100dvh;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .title{font-size:clamp(22px,5vw,34px);font-weight:900;letter-spacing:-.03em}
  .smallbtn{border:0;border-radius:999px;background:#fff;padding:10px 14px;box-shadow:var(--shadow);font-weight:800;color:var(--ink)}
  .status{margin:10px 0 8px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);text-align:center}
  .status strong{display:block;font-size:20px}
  .status span{color:var(--muted);font-size:14px}
  .computer-row,.hand-row{display:flex;align-items:center;justify-content:center;gap:7px;min-height:74px;flex-wrap:wrap}
  .computer-label,.hand-label{text-align:center;color:var(--muted);font-size:13px;font-weight:800;margin-top:2px}
  .board-wrap{position:relative;flex:1;min-height:240px;margin:6px 0;background:linear-gradient(180deg,#cde8d9,#b8dbc8);border-radius:28px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45);overflow:hidden;padding:18px 10px}
  .board{height:100%;display:flex;align-items:center;justify-content:flex-start;gap:6px;overflow-x:auto;padding:8px 16px;scroll-snap-type:x proximity}
  .board:empty::after{content:"Put the first domino here";margin:auto;color:#4d6c5d;font-weight:900;font-size:18px}
  .domino{
    flex:0 0 auto;width:52px;height:96px;background:#fff;border:2px solid #29343b;border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.12);
    display:grid;grid-template-rows:1fr 1fr;position:relative;overflow:hidden;scroll-snap-align:center;transition:.15s transform,.15s opacity
  }
  .domino.horizontal{width:96px;height:52px;grid-template-columns:1fr 1fr;grid-template-rows:1fr}
  .domino.horizontal::after{content:"";position:absolute;top:7px;bottom:7px;left:50%;width:2px;background:#29343b;transform:translateX(-1px)}
  .domino:not(.horizontal)::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:2px;background:#29343b;transform:translateY(-1px)}
  .domino.playable{outline:4px solid var(--accent2);transform:translateY(-3px)}
  .domino.selected{outline:5px solid var(--accent);transform:translateY(-6px)}
  .domino.disabled{opacity:.48}
  .half{display:grid;place-items:center;position:relative}
  .pip{width:8px;height:8px;border-radius:50%;background:#26323a;position:absolute}
  .back{width:38px;height:62px;border-radius:8px;background:repeating-linear-gradient(45deg,#467cbd 0 7px,#fff 7px 11px);border:2px solid #29343b;box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .hintbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0 8px}
  .action{border:0;border-radius:16px;padding:12px 18px;background:var(--accent);color:white;font-weight:900;box-shadow:0 5px 0 #2a6d55}
  .action.secondary{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d9d7d0}
  .action:disabled{opacity:.4;box-shadow:none}
  .hand-scroll{overflow-x:auto;padding:2px 4px 8px}
  .hand-row{justify-content:flex-start;flex-wrap:nowrap;min-width:max-content;padding:2px 8px}
  .hand-row .domino{cursor:pointer}
  .footer{font-size:12px;text-align:center;color:var(--muted);padding-top:2px}
  .modal{position:fixed;inset:0;background:rgba(20,28,32,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal.show{display:flex}
  .modal-card{background:#fff;border-radius:28px;max-width:420px;width:100%;padding:24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal-card h2{font-size:30px;margin:0 0 8px}
  .modal-card p{color:var(--muted);font-size:17px}
  .bigbtn{width:100%;border:0;border-radius:18px;padding:15px;background:var(--accent2);font-weight:900;font-size:18px;color:#2d2b24}
  .spark{font-size:44px}
  @media (max-width:430px){
    .domino{width:46px;height:84px}
    .domino.horizontal{width:84px;height:46px}
    .pip{width:7px;height:7px}
    .board-wrap{min-height:220px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title">Little Dominoes</div>
    <button class="smallbtn" id="newBtn">New game</button>
  </div>

  <div class="status" id="status">
    <strong>Loading…</strong>
    <span>Match the dots on either end.</span>
  </div>

  <div class="computer-label">Grown-up / Computer</div>
  <div class="computer-row" id="computerHand"></div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="hintbar">
    <button class="action secondary" id="hintBtn">✨ Show me a move</button>
    <button class="action" id="drawBtn">Pick a domino</button>
  </div>

  <div class="hand-label">Your dominoes</div>
  <div class="hand-scroll">
    <div class="hand-row" id="playerHand"></div>
  </div>

  <div class="footer">Tap a glowing domino, then tap the left or right end.</div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="spark" id="modalEmoji">🎉</div>
    <h2 id="modalTitle">You did it!</h2>
    <p id="modalText"></p>
    <button class="bigbtn" id="againBtn">Play again</button>
  </div>
</div>

<script>
const MAX = 6;
let stock=[], player=[], computer=[], chain=[], turn='player', selectedIndex=null, gameOver=false;

const statusEl = document.getElementById('status');
const boardEl = document.getElementById('board');
const playerEl = document.getElementById('playerHand');
const computerEl = document.getElementById('computerHand');
const drawBtn = document.getElementById('drawBtn');
const hintBtn = document.getElementById('hintBtn');
const modal = document.getElementById('modal');

function makeSet(){
  const s=[];
  for(let a=0;a<=MAX;a++) for(let b=a;b<=MAX;b++) s.push([a,b]);
  return shuffle(s);
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function startGame(){
  stock=makeSet(); player=stock.splice(0,7); computer=stock.splice(0,7); chain=[]; turn='player'; selectedIndex=null; gameOver=false;
  modal.classList.remove('show');
  render();
}
function ends(){
  if(!chain.length) return [null,null];
  return [chain[0][0], chain[chain.length-1][1]];
}
function movesFor(hand){
  if(!chain.length) return hand.map((_,i)=>({i,side:'right'}));
  const [L,R]=ends(); const m=[];
  hand.forEach((d,i)=>{
    if(d[0]===L || d[1]===L) m.push({i,side:'left'});
    if(d[0]===R || d[1]===R) m.push({i,side:'right'});
  });
  return m;
}
function oriented(d, side){
  if(!chain.length) return d.slice();
  const [L,R]=ends();
  if(side==='left'){
    if(d[1]===L) return d.slice();
    if(d[0]===L) return [d[1],d[0]];
  } else {
    if(d[0]===R) return d.slice();
    if(d[1]===R) return [d[1],d[0]];
  }
  return null;
}
function playFrom(hand, i, side){
  const d=oriented(hand[i],side); if(!d) return false;
  hand.splice(i,1);
  if(!chain.length || side==='right') chain.push(d); else chain.unshift(d);
  selectedIndex=null;
  return true;
}
function pipPositions(n){
  const pos = {
    0:[],
    1:[[50,50]],
    2:[[30,30],[70,70]],
    3:[[30,30],[50,50],[70,70]],
    4:[[30,30],[70,30],[30,70],[70,70]],
    5:[[30,30],[70,30],[50,50],[30,70],[70,70]],
    6:[[30,24],[70,24],[30,50],[70,50],[30,76],[70,76]]
  };
  return pos[n];
}
function halfHTML(n){
  return `<div class="half">${pipPositions(n).map(([x,y])=>`<span class="pip" style="left:${x}%;top:${y}%;transform:translate(-50%,-50%)"></span>`).join('')}</div>`;
}
function dominoHTML(d, cls='', idx=''){
  return `<div class="domino ${cls}" data-i="${idx}">${halfHTML(d[0])}${halfHTML(d[1])}</div>`;
}
function render(){
  const pm = movesFor(player);
  const playable = new Set(pm.map(m=>m.i));

  computerEl.innerHTML = computer.map(()=>'<div class="back"></div>').join('');
  boardEl.innerHTML = chain.map(d=>dominoHTML(d,'horizontal')).join('');
  playerEl.innerHTML = player.map((d,i)=>{
    let cls='';
    if(turn==='player' && playable.has(i)) cls+=' playable';
    if(selectedIndex===i) cls+=' selected';
    if(turn!=='player' || (!playable.has(i) && chain.length)) cls+=' disabled';
    return dominoHTML(d,cls,i);
  }).join('');

  [...playerEl.querySelectorAll('.domino')].forEach(el=>{
    el.addEventListener('click', ()=>chooseDomino(Number(el.dataset.i)));
  });

  boardEl.onclick = e => {
    if(turn!=='player' || selectedIndex===null || gameOver) return;
    const rect=boardEl.getBoundingClientRect();
    const side=(e.clientX-rect.left)<rect.width/2?'left':'right';
    if(playFrom(player,selectedIndex,side)){
      afterPlayerMove();
    } else {
      say('That end does not match','Try the other end.');
    }
  };

  drawBtn.disabled = turn!=='player' || gameOver || pm.length>0;
  drawBtn.textContent = stock.length ? 'Pick a domino' : 'No dominoes left';

  if(gameOver) return;
  if(turn==='player'){
    if(!chain.length) say('Your turn!','Pick any domino to start.');
    else if(pm.length) say('Your turn!','Tap a glowing domino, then choose an end.');
    else if(stock.length) say('No match yet','Pick a new domino.');
    else say('No match','You have to pass this turn.');
  } else {
    say('Computer’s turn','It is thinking…');
  }
  boardEl.scrollLeft = boardEl.scrollWidth;
}
function say(big,small){statusEl.innerHTML=`<strong>${big}</strong><span>${small}</span>`}

function chooseDomino(i){
  if(turn!=='player' || gameOver) return;
  const legal=movesFor(player).some(m=>m.i===i);
  if(chain.length && !legal) return;
  selectedIndex = selectedIndex===i ? null : i;
  render();
  if(!chain.length && selectedIndex!==null){
    playFrom(player,selectedIndex,'right');
    afterPlayerMove();
  } else if(selectedIndex!==null) {
    const sides=movesFor(player).filter(m=>m.i===selectedIndex).map(m=>m.side);
    if(sides.length===1){
      playFrom(player,selectedIndex,sides[0]);
      afterPlayerMove();
    } else {
      say('Great choice!','Tap the left or right side of the green board.');
    }
  }
}
function afterPlayerMove(){
  if(checkWin()) return;
  turn='computer'; render();
  setTimeout(computerTurn,650);
}
function computerTurn(){
  if(gameOver) return;
  let moves=movesFor(computer);
  while(!moves.length && stock.length){
    computer.push(stock.pop()); moves=movesFor(computer);
  }
  if(moves.length){
    const move=moves[Math.floor(Math.random()*moves.length)];
    playFrom(computer,move.i,move.side);
  }
  if(checkWin()) return;
  turn='player'; selectedIndex=null; render();

  if(!movesFor(player).length && !stock.length){
    setTimeout(()=>{ turn='computer'; computerTurn(); },650);
  }
}
function drawOne(){
  if(turn!=='player' || gameOver) return;
  if(movesFor(player).length) return;
  if(stock.length){
    player.push(stock.pop()); render();
    const m=movesFor(player);
    if(m.length) say('You found a match!','Tap the glowing domino.');
  } else {
    say('You pass','The computer gets a turn.');
    turn='computer'; render(); setTimeout(computerTurn,650);
  }
}
function checkWin(){
  if(player.length===0){finish('You win!','Amazing matching! 🌟','🏆');return true}
  if(computer.length===0){finish('Computer wins','Good game! Want another go?','🙂');return true}
  if(stock.length===0 && !movesFor(player).length && !movesFor(computer).length){
    const ps=player.flat().reduce((a,b)=>a+b,0), cs=computer.flat().reduce((a,b)=>a+b,0);
    if(ps<cs) finish('You win!','You have fewer dots left. Brilliant!','🏆');
    else if(cs<ps) finish('Computer wins','Very close — try again!','🙂');
    else finish('It’s a draw!','Exactly the same number of dots.','🤝');
    return true;
  }
  return false;
}
function finish(title,text,emoji){
  gameOver=true;
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalText').textContent=text;
  document.getElementById('modalEmoji').textContent=emoji;
  modal.classList.add('show');
  render();
}
function hint(){
  if(turn!=='player' || gameOver) return;
  const m=movesFor(player);
  if(!m.length){
    say(stock.length?'Try picking a domino':'No match — pass this turn',stock.length?'You may find one that matches.':'The computer will play next.');
    return;
  }
  const move=m[0];
  selectedIndex=move.i; render();
  say('Try this one!','It is outlined in green.');
}
drawBtn.addEventListener('click',drawOne);
hintBtn.addEventListener('click',hint);
document.getElementById('newBtn').addEventListener('click',startGame);
document.getElementById('againBtn').addEventListener('click',startGame);
startGame();
</script>
</body>
</html>
