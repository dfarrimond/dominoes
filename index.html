<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Little Dominoes</title>
<style>
:root{--bg:#f7f4ea;--ink:#24303a;--card:#fffdf7;--accent:#3d8f6f;--accent2:#f2b84b;--muted:#6e7b83;--shadow:0 8px 22px rgba(30,40,45,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;color:var(--ink)}body{min-height:100dvh;display:flex;justify-content:center}button,select,input{font:inherit}.app{width:min(100%,760px);min-height:100dvh;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:clamp(22px,5vw,34px);font-weight:900;letter-spacing:-.03em}.top-actions{display:flex;gap:8px}.smallbtn{border:0;border-radius:999px;background:#fff;padding:10px 14px;box-shadow:var(--shadow);font-weight:800;color:var(--ink)}.status{margin:10px 0 8px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);text-align:center}.status strong{display:block;font-size:20px}.status span{color:var(--muted);font-size:14px}.opponent-row,.hand-row{display:flex;align-items:center;justify-content:center;gap:7px;min-height:74px;flex-wrap:wrap}.opponent-label,.hand-label{text-align:center;color:var(--muted);font-size:13px;font-weight:800;margin-top:2px}.board-wrap{position:relative;flex:1;min-height:240px;margin:6px 0;background:linear-gradient(180deg,#cde8d9,#b8dbc8);border-radius:28px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45);overflow:hidden;padding:18px 10px}.board{height:100%;display:flex;align-items:center;justify-content:flex-start;gap:6px;overflow-x:auto;padding:8px 16px;scroll-snap-type:x proximity}.board:empty::after{content:"Put the first domino here";margin:auto;color:#4d6c5d;font-weight:900;font-size:18px}.domino{flex:0 0 auto;width:52px;height:96px;background:#fff;border:2px solid #29343b;border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.12);display:grid;grid-template-rows:1fr 1fr;position:relative;overflow:hidden;scroll-snap-align:center;transition:.15s transform,.15s opacity}.domino.horizontal{width:96px;height:52px;grid-template-columns:1fr 1fr;grid-template-rows:1fr}.domino.horizontal::after{content:"";position:absolute;top:7px;bottom:7px;left:50%;width:2px;background:#29343b;transform:translateX(-1px)}.domino:not(.horizontal)::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:2px;background:#29343b;transform:translateY(-1px)}.domino.playable{outline:4px solid var(--accent2);transform:translateY(-3px)}.domino.selected{outline:5px solid var(--accent);transform:translateY(-6px)}.domino.disabled{opacity:.48}.half{display:grid;place-items:center;position:relative}.pip{width:8px;height:8px;border-radius:50%;background:#26323a;position:absolute}.back{width:38px;height:62px;border-radius:8px;background:repeating-linear-gradient(45deg,#467cbd 0 7px,#fff 7px 11px);border:2px solid #29343b;box-shadow:0 3px 0 rgba(0,0,0,.12)}.hintbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0 8px}.action{border:0;border-radius:16px;padding:12px 18px;background:var(--accent);color:white;font-weight:900;box-shadow:0 5px 0 #2a6d55}.action.secondary{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d9d7d0}.action:disabled{opacity:.4;box-shadow:none}.hand-scroll{overflow-x:auto;padding:2px 4px 8px}.hand-row{justify-content:flex-start;flex-wrap:nowrap;min-width:max-content;padding:2px 8px}.hand-row .domino{cursor:pointer}.footer{font-size:12px;text-align:center;color:var(--muted);padding-top:2px}.modal,.sheet{position:fixed;inset:0;background:rgba(20,28,32,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show,.sheet.show{display:flex}.modal-card,.sheet-card{background:#fff;border-radius:28px;max-width:440px;width:100%;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}.modal-card{text-align:center}.modal-card h2,.sheet-card h2{font-size:30px;margin:0 0 8px}.modal-card p,.sheet-card p{color:var(--muted);font-size:16px}.bigbtn{width:100%;border:0;border-radius:18px;padding:15px;background:var(--accent2);font-weight:900;font-size:18px;color:#2d2b24}.spark{font-size:44px}.setting{padding:14px 0;border-top:1px solid #ece9e0}.setting:first-of-type{border-top:0}.setting label{display:block;font-weight:900;margin-bottom:8px}.segmented{display:grid;grid-template-columns:1fr 1fr;gap:8px}.segmented button{border:2px solid #e2ded4;background:#fff;border-radius:14px;padding:11px;font-weight:800}.segmented button.active{background:var(--accent);border-color:var(--accent);color:#fff}.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.switch{width:54px;height:32px;border:0;border-radius:999px;background:#c9cec9;padding:3px;transition:.2s}.switch::after{content:"";display:block;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(22px)}select{width:100%;border:2px solid #e2ded4;border-radius:14px;padding:11px;background:#fff;color:var(--ink)}.handoff{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;align-items:center;justify-content:center;padding:28px;text-align:center}.handoff.show{display:flex}.handoff-card{background:#fff;border-radius:28px;padding:28px;max-width:420px;box-shadow:var(--shadow)}.handoff h2{font-size:30px;margin:0 0 8px}.handoff p{color:var(--muted)}
@media(max-width:430px){.domino{width:46px;height:84px}.domino.horizontal{width:84px;height:46px}.pip{width:7px;height:7px}.board-wrap{min-height:220px}.smallbtn{padding:9px 11px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><div class="title">Little Dominoes</div><div class="top-actions"><button class="smallbtn" id="settingsBtn">⚙️</button><button class="smallbtn" id="newBtn">New game</button></div></div>
  <div class="status" id="status"><strong>Loading…</strong><span>Match the dots on either end.</span></div>
  <div class="opponent-label" id="opponentLabel">Computer</div><div class="opponent-row" id="opponentHand"></div>
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="hintbar"><button class="action secondary" id="hintBtn">✨ Show me a move</button><button class="action" id="drawBtn">Pick a domino</button></div>
  <div class="hand-label" id="handLabel">Your dominoes</div><div class="hand-scroll"><div class="hand-row" id="playerHand"></div></div>
  <div class="footer" id="footer">Tap a domino, then tap the left or right end.</div>
</div>
<div class="modal" id="modal"><div class="modal-card"><div class="spark" id="modalEmoji">🎉</div><h2 id="modalTitle">You did it!</h2><p id="modalText"></p><button class="bigbtn" id="againBtn">Play again</button></div></div>
<div class="sheet" id="settingsSheet"><div class="sheet-card"><h2>Game settings</h2><p>Choose how you want to play.</p>
  <div class="setting"><label>Game mode</label><div class="segmented"><button id="singleMode">1 player</button><button id="twoMode">2 players</button></div></div>
  <div class="setting"><div class="switch-row"><div><label style="margin:0">Highlight playable dominoes</label><p style="margin:3px 0 0">Helpful for younger players.</p></div><button class="switch" id="highlightSwitch" aria-label="Toggle highlighting"></button></div></div>
  <div class="setting" id="difficultySetting"><label for="difficulty">Computer difficulty</label><select id="difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select><p id="difficultyHelp" style="margin:8px 0 0"></p></div>
  <button class="bigbtn" id="saveSettings">Save & start new game</button>
</div></div>
<div class="handoff" id="handoff"><div class="handoff-card"><h2 id="handoffTitle">Player 2's turn</h2><p>Pass the phone over so nobody sees the other hand.</p><button class="bigbtn" id="handoffBtn">I'm ready</button></div></div>
<script>
const MAX=6;
const defaults={mode:'single',highlight:true,difficulty:'medium'};
let settings=loadSettings();
let stock=[],hands=[[],[]],chain=[],turn=0,selectedIndex=null,gameOver=false,awaitingHandoff=false;
const $=id=>document.getElementById(id);
const statusEl=$('status'),boardEl=$('board'),playerEl=$('playerHand'),opponentEl=$('opponentHand'),drawBtn=$('drawBtn'),hintBtn=$('hintBtn'),modal=$('modal');
function loadSettings(){try{return {...defaults,...JSON.parse(localStorage.getItem('littleDominoesSettings')||'{}')}}catch{return {...defaults}}}
function saveSettingsLocal(){localStorage.setItem('littleDominoesSettings',JSON.stringify(settings))}
function makeSet(){const s=[];for(let a=0;a<=MAX;a++)for(let b=a;b<=MAX;b++)s.push([a,b]);return shuffle(s)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(){stock=makeSet();hands=[stock.splice(0,7),stock.splice(0,7)];chain=[];turn=0;selectedIndex=null;gameOver=false;awaitingHandoff=false;modal.classList.remove('show');$('handoff').classList.remove('show');render()}
function ends(){return chain.length?[chain[0][0],chain[chain.length-1][1]]:[null,null]}
function movesFor(hand){if(!chain.length)return hand.map((_,i)=>({i,side:'right'}));const[L,R]=ends(),m=[];hand.forEach((d,i)=>{if(d[0]===L||d[1]===L)m.push({i,side:'left'});if(d[0]===R||d[1]===R)m.push({i,side:'right'})});return m}
function oriented(d,side){if(!chain.length)return d.slice();const[L,R]=ends();if(side==='left'){if(d[1]===L)return d.slice();if(d[0]===L)return[d[1],d[0]]}else{if(d[0]===R)return d.slice();if(d[1]===R)return[d[1],d[0]]}return null}
function playFrom(hand,i,side){const d=oriented(hand[i],side);if(!d)return false;hand.splice(i,1);if(!chain.length||side==='right')chain.push(d);else chain.unshift(d);selectedIndex=null;return true}
function pipPositions(n){return{0:[],1:[[50,50]],2:[[30,30],[70,70]],3:[[30,30],[50,50],[70,70]],4:[[30,30],[70,30],[30,70],[70,70]],5:[[30,30],[70,30],[50,50],[30,70],[70,70]],6:[[30,24],[70,24],[30,50],[70,50],[30,76],[70,76]]}[n]}
function halfHTML(n){return`<div class="half">${pipPositions(n).map(([x,y])=>`<span class="pip" style="left:${x}%;top:${y}%;transform:translate(-50%,-50%)"></span>`).join('')}</div>`}
function dominoHTML(d,cls='',idx=''){return`<div class="domino ${cls}" data-i="${idx}">${halfHTML(d[0])}${halfHTML(d[1])}</div>`}
function activeHand(){return hands[turn]}function otherHand(){return hands[1-turn]}
function render(){const hand=activeHand(),pm=movesFor(hand),playable=new Set(pm.map(m=>m.i)),humanTurn=settings.mode==='two'||turn===0;
  $('opponentLabel').textContent=settings.mode==='single'?'Computer':`Player ${2-turn}'s dominoes`;$('handLabel').textContent=settings.mode==='single'?'Your dominoes':`Player ${turn+1}'s dominoes`;
  opponentEl.innerHTML=otherHand().map(()=>'<div class="back"></div>').join('');boardEl.innerHTML=chain.map(d=>dominoHTML(d,'horizontal')).join('');
  playerEl.innerHTML=hand.map((d,i)=>{let cls='';if(humanTurn&&settings.highlight&&playable.has(i))cls+=' playable';if(selectedIndex===i)cls+=' selected';if(!humanTurn||(!playable.has(i)&&chain.length))cls+=' disabled';return dominoHTML(d,cls,i)}).join('');
  [...playerEl.querySelectorAll('.domino')].forEach(el=>el.addEventListener('click',()=>chooseDomino(Number(el.dataset.i))));
  boardEl.onclick=e=>{if(!humanTurn||selectedIndex===null||gameOver||awaitingHandoff)return;const rect=boardEl.getBoundingClientRect(),side=(e.clientX-rect.left)<rect.width/2?'left':'right';if(playFrom(hand,selectedIndex,side))afterHumanMove();else say('That end does not match','Try the other end.')};
  drawBtn.disabled=!humanTurn||gameOver||awaitingHandoff||pm.length>0;drawBtn.textContent=stock.length?'Pick a domino':'Pass turn';hintBtn.style.display=settings.highlight?'none':'inline-block';hintBtn.disabled=!humanTurn||gameOver||awaitingHandoff;
  if(gameOver)return;if(settings.mode==='single'&&turn===1)say('Computer’s turn','It is thinking…');else if(!chain.length)say(`${settings.mode==='two'?`Player ${turn+1}`:'Your'} turn!`,'Pick any domino to start.');else if(pm.length)say(`${settings.mode==='two'?`Player ${turn+1}`:'Your'} turn!`,settings.highlight?'Tap a glowing domino.':'Find a domino that matches an end.');else if(stock.length)say('No match yet','Pick a new domino.');else say('No match','Pass the turn.');boardEl.scrollLeft=boardEl.scrollWidth}
function say(big,small){statusEl.innerHTML=`<strong>${big}</strong><span>${small}</span>`}
function chooseDomino(i){const humanTurn=settings.mode==='two'||turn===0;if(!humanTurn||gameOver||awaitingHandoff)return;const hand=activeHand(),legal=movesFor(hand).some(m=>m.i===i);if(chain.length&&!legal)return;selectedIndex=selectedIndex===i?null:i;render();if(!chain.length&&selectedIndex!==null){playFrom(hand,selectedIndex,'right');afterHumanMove()}else if(selectedIndex!==null){const sides=movesFor(hand).filter(m=>m.i===selectedIndex).map(m=>m.side);if(sides.length===1){playFrom(hand,selectedIndex,sides[0]);afterHumanMove()}else say('Great choice!','Tap the left or right side of the green board.')}}
function afterHumanMove(){if(checkWin())return;if(settings.mode==='single'){turn=1;render();setTimeout(computerTurn,500)}else nextTwoPlayerTurn()}
function nextTwoPlayerTurn(){turn=1-turn;selectedIndex=null;awaitingHandoff=true;$('handoffTitle').textContent=`Player ${turn+1}'s turn`;$('handoff').classList.add('show');render()}
function chooseComputerMove(moves){if(settings.difficulty==='easy')return moves[Math.floor(Math.random()*moves.length)];if(settings.difficulty==='medium'){return [...moves].sort((a,b)=>{const da=hands[1][a.i],db=hands[1][b.i];return(db[0]+db[1])-(da[0]+da[1])})[0]}
  const [L,R]=ends();return [...moves].sort((a,b)=>{const dA=hands[1][a.i],dB=hands[1][b.i];const score=d=>{const after=d[0]+d[1];const double=d[0]===d[1]?4:0;const frequency=hands[1].reduce((s,x)=>s+x.filter(v=>d.includes(v)).length,0);return after+double+frequency*2};return score(dB)-score(dA)})[0]}
function computerTurn(){if(gameOver)return;let moves=movesFor(hands[1]);while(!moves.length&&stock.length){hands[1].push(stock.pop());moves=movesFor(hands[1])}if(moves.length){const move=chooseComputerMove(moves);playFrom(hands[1],move.i,move.side);}if(checkWin())return;turn=0;selectedIndex=null;render();if(!movesFor(hands[0]).length&&!stock.length){setTimeout(()=>{turn=1;render();setTimeout(computerTurn,450)},500)}}
function drawOne(){const humanTurn=settings.mode==='two'||turn===0;if(!humanTurn||gameOver||awaitingHandoff)return;const hand=activeHand();if(movesFor(hand).length)return;if(stock.length){hand.push(stock.pop());render();if(movesFor(hand).length)say('You found a match!',settings.highlight?'Tap the glowing domino.':'See if the new domino matches.')}else{if(settings.mode==='single'){say('You pass','The computer gets a turn.');turn=1;render();setTimeout(computerTurn,500)}else nextTwoPlayerTurn()}}
function checkWin(){if(hands[0].length===0){finish(settings.mode==='single'?'You win!':'Player 1 wins!','Amazing matching! 🌟','🏆');return true}if(hands[1].length===0){finish(settings.mode==='single'?'Computer wins':'Player 2 wins!',settings.mode==='single'?'Good game! Want another go?':'Great game!','🙂');return true}if(stock.length===0&&!movesFor(hands[0]).length&&!movesFor(hands[1]).length){const p0=hands[0].flat().reduce((a,b)=>a+b,0),p1=hands[1].flat().reduce((a,b)=>a+b,0);if(p0<p1)finish(settings.mode==='single'?'You win!':'Player 1 wins!','Fewer dots left wins.','🏆');else if(p1<p0)finish(settings.mode==='single'?'Computer wins':'Player 2 wins!','Fewer dots left wins.','🏆');else finish('It’s a draw!','Exactly the same number of dots.','🤝');return true}return false}
function finish(title,text,emoji){gameOver=true;$('modalTitle').textContent=title;$('modalText').textContent=text;$('modalEmoji').textContent=emoji;modal.classList.add('show');render()}
function hint(){if(gameOver||awaitingHandoff)return;const m=movesFor(activeHand());if(!m.length){say(stock.length?'Try picking a domino':'No match — pass this turn',stock.length?'You may find one that matches.':'The other player goes next.');return}selectedIndex=m[0].i;render();say('Try this one!','It is outlined in green.')}
function openSettings(){$('singleMode').classList.toggle('active',settings.mode==='single');$('twoMode').classList.toggle('active',settings.mode==='two');$('highlightSwitch').classList.toggle('on',settings.highlight);$('difficulty').value=settings.difficulty;updateDifficultyUI();$('settingsSheet').classList.add('show')}
function updateDifficultyUI(){const single=$('singleMode').classList.contains('active');$('difficultySetting').style.display=single?'block':'none';const v=$('difficulty').value;$('difficultyHelp').textContent={easy:'Plays a random legal domino.',medium:'Usually plays higher-value dominoes first.',hard:'Prefers stronger moves, doubles, and useful numbers.'}[v]}
$('singleMode').onclick=()=>{$('singleMode').classList.add('active');$('twoMode').classList.remove('active');updateDifficultyUI()};$('twoMode').onclick=()=>{$('twoMode').classList.add('active');$('singleMode').classList.remove('active');updateDifficultyUI()};$('highlightSwitch').onclick=()=>$('highlightSwitch').classList.toggle('on');$('difficulty').onchange=updateDifficultyUI;$('saveSettings').onclick=()=>{settings.mode=$('twoMode').classList.contains('active')?'two':'single';settings.highlight=$('highlightSwitch').classList.contains('on');settings.difficulty=$('difficulty').value;saveSettingsLocal();$('settingsSheet').classList.remove('show');startGame()};$('settingsBtn').onclick=openSettings;$('newBtn').onclick=startGame;$('againBtn').onclick=startGame;drawBtn.onclick=drawOne;hintBtn.onclick=hint;$('handoffBtn').onclick=()=>{awaitingHandoff=false;$('handoff').classList.remove('show');render()};
startGame();
</script>
</body></html>
